apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoengineer-ai-service
  namespace: default
  labels:
    app: autoengineer-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autoengineer-ai-service
  template:
    metadata:
      labels:
        app: autoengineer-ai-service
    spec:
      containers:
      - name: ai-service
        image: autoengineer/ai-service:latest
        ports:
        - containerPort: 8001
        resources:
          limits:
            cpu: "1000m"
            memory: "1024Mi"
          requests:
            cpu: "250m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: autoengineer-ai-service
spec:
  selector:
    app: autoengineer-ai-service
  ports:
  - port: 8001
    targetPort: 8001
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: autoengineer-ai-service-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: autoengineer-ai-service
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 75
